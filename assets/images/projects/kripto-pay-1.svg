<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F111A"/>
      <stop offset="50%" stop-color="#151726"/>
      <stop offset="100%" stop-color="#0D0E15"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="393" height="852" fill="url(#bgGrad)"/>

  <!-- Ambient Glow -->
  <circle cx="320" cy="180" r="140" fill="#2563EB" opacity="0.18" filter="url(#blurGlow)"/>
  <circle cx="80" cy="520" r="160" fill="#06B6D4" opacity="0.12" filter="url(#blurGlow)"/>

  <!-- Status Bar Space -->
  <text x="36" y="52" fill="#FFFFFF" font-family="-apple-system, SF Pro Text, sans-serif" font-weight="600" font-size="15">9:41</text>
  <!-- Signal, Wifi, Battery -->
  <g fill="#FFFFFF" transform="translate(325, 40)">
    <path d="M18 5h2v6h-2zM14 7h2v4h-2zM10 9h2v2h-2zM6 10h2v1H6z"/>
    <path d="M28 4h18a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H28a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm21 3v4a1.5 1.5 0 0 0 0-4z"/>
    <rect x="30" y="6" width="13" height="6" rx="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Top App Bar -->
  <g transform="translate(24, 76)">
    <circle cx="20" cy="20" r="20" fill="#262938"/>
    <!-- User Icon -->
    <path d="M20 12a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0 10c4.4 0 8 2.2 8 5v1H12v-1c0-2.8 3.6-5 8-5z" fill="#94A3B8"/>
    <text x="50" y="16" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Selamat Datang</text>
    <text x="50" y="32" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="700" font-size="16">Fauzi's Vault</text>

    <!-- Bell notification icon -->
    <circle cx="325" cy="20" r="20" fill="#262938"/>
    <circle cx="332" cy="12" r="4" fill="#EF4444"/>
    <path d="M325 14a3 3 0 0 0-3 3v2l-1 1v1h8v-1l-1-1v-2a3 3 0 0 0-3-3z" fill="#FFFFFF"/>
  </g>

  <!-- Balance Card (SwiftUI Glass Card Style) -->
  <g transform="translate(20, 136)">
    <rect width="353" height="190" rx="28" fill="url(#cardGrad)"/>
    <!-- Internal Pattern -->
    <circle cx="320" cy="30" r="90" fill="#FFFFFF" opacity="0.08"/>
    <circle cx="20" cy="180" r="70" fill="#000000" opacity="0.15"/>

    <text x="24" y="38" fill="#E0E7FF" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Total Portofolio Aset</text>
    <text x="24" y="82" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="34" font-weight="800">Rp 184.520.000</text>

    <g transform="translate(24, 100)">
      <rect width="90" height="24" rx="12" fill="#10B981" opacity="0.25"/>
      <text x="14" y="16" fill="#34D399" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">▲ +14.82%</text>
      <text x="100" y="16" fill="#C7D2FE" font-family="-apple-system, sans-serif" font-size="12">Bulan ini</text>
    </g>

    <!-- Card Action Buttons -->
    <line x1="24" y1="136" x2="329" y2="136" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
    
    <g transform="translate(30, 150)">
      <circle cx="12" cy="12" r="14" fill="#FFFFFF" opacity="0.2"/>
      <path d="M12 7l4 4m-4-4l-4 4m4-4v10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="34" y="16" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Kirim</text>
    </g>
    <g transform="translate(136, 150)">
      <circle cx="12" cy="12" r="14" fill="#FFFFFF" opacity="0.2"/>
      <path d="M12 17l4-4m-4 4l-4-4m4 4V7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="34" y="16" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Terima</text>
    </g>
    <g transform="translate(244, 150)">
      <circle cx="12" cy="12" r="14" fill="#FFFFFF" opacity="0.2"/>
      <circle cx="12" cy="12" r="5" stroke="#FFFFFF" stroke-width="2" fill="none"/>
      <text x="34" y="16" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Swap</text>
    </g>
  </g>

  <!-- Swift Charts Preview Section -->
  <g transform="translate(24, 348)">
    <text x="0" y="18" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="700" font-size="18">Analisis Performa</text>
    <text x="290" y="18" fill="#38BDF8" font-family="-apple-system, sans-serif" font-weight="600" font-size="13">1B ▼</text>

    <!-- Mini Chart Card -->
    <rect x="0" y="32" width="345" height="130" rx="20" fill="#171926" stroke="#25293C" stroke-width="1"/>
    
    <!-- Chart Grid Lines -->
    <line x1="20" y1="70" x2="325" y2="70" stroke="#2D3249" stroke-dasharray="3,3"/>
    <line x1="20" y1="110" x2="325" y2="110" stroke="#2D3249" stroke-dasharray="3,3"/>
    
    <!-- Smooth SVG Path (representing Swift Charts) -->
    <path d="M20 120 Q 60 130, 90 95 T 160 85 T 230 50 T 290 65 T 325 45" fill="none" stroke="url(#glowGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Area Under Curve -->
    <path d="M20 120 Q 60 130, 90 95 T 160 85 T 230 50 T 290 65 T 325 45 L 325 140 L 20 140 Z" fill="url(#glowGrad)" opacity="0.12"/>
    <!-- Peak dot -->
    <circle cx="325" cy="45" r="5" fill="#38BDF8"/>
    <circle cx="325" cy="45" r="9" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- Recent Transactions Section -->
  <g transform="translate(24, 530)">
    <text x="0" y="16" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="700" font-size="18">Transaksi Terakhir</text>
    <text x="295" y="16" fill="#94A3B8" font-family="-apple-system, sans-serif" font-weight="500" font-size="13">Semua</text>

    <!-- Tx 1: Apple Inc (AAPL) -->
    <g transform="translate(0, 32)">
      <rect width="345" height="66" rx="16" fill="#171926" stroke="#25293C" stroke-width="0.8"/>
      <rect x="14" y="13" width="40" height="40" rx="12" fill="#000000"/>
      <!-- Apple logo symbol -->
      <path d="M34 27c0-2.2 1.8-3.4 1.9-3.5-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 0.8 1.1 1.7 2.3 2.9 2.2 1.1 0 1.6-.7 2.9-.7 1.4 0 1.8.7 2.9.7 1.2 0 2-.1 2.8-1.2 1-1.3 1.3-2.6 1.4-2.7-0.1 0-2.7-1-2.7-4.1zM32 21.2c0.6-.8 1-1.8 0.9-2.9-0.9 0-2 .6-2.6 1.4-.5.7-.9 1.8-0.8 2.8 1 0.1 1.9-.5 2.5-1.3z" fill="#FFFFFF"/>
      <text x="64" y="30" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="600" font-size="15">Apple Stock (AAPL)</text>
      <text x="64" y="46" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">18 Sep • Dividen Masuk</text>
      <text x="330" y="30" text-anchor="end" fill="#34D399" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">+Rp 1.420.000</text>
      <text x="330" y="46" text-anchor="end" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Berhasil</text>
    </g>

    <!-- Tx 2: Ethereum -->
    <g transform="translate(0, 108)">
      <rect width="345" height="66" rx="16" fill="#171926" stroke="#25293C" stroke-width="0.8"/>
      <circle cx="34" cy="33" r="20" fill="#627EEA"/>
      <polygon points="34,19 25,34 34,29" fill="#C0CBF6"/>
      <polygon points="34,19 34,29 43,34" fill="#FFFFFF"/>
      <polygon points="34,31 25,36 34,47" fill="#C0CBF6"/>
      <polygon points="34,31 34,47 43,36" fill="#FFFFFF"/>
      <text x="64" y="30" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="600" font-size="15">Ethereum (ETH)</text>
      <text x="64" y="46" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">17 Sep • Beli Kripto</text>
      <text x="330" y="30" text-anchor="end" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">-Rp 3.500.000</text>
      <text x="330" y="46" text-anchor="end" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">0.072 ETH</text>
    </g>
  </g>

  <!-- iOS Tab Bar -->
  <g transform="translate(0, 768)">
    <rect width="393" height="84" fill="#11131E" opacity="0.95"/>
    <line x1="0" y1="0" x2="393" y2="0" stroke="#232738" stroke-width="1"/>
    <!-- Home Tab (Active) -->
    <g transform="translate(55, 12)">
      <circle cx="12" cy="12" r="8" fill="#2563EB" opacity="0.2"/>
      <path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-4h-4v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z" fill="#2563EB"/>
      <text x="12" y="32" text-anchor="middle" fill="#2563EB" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Home</text>
    </g>
    <!-- Market Tab -->
    <g transform="translate(145, 12)">
      <path d="M4 18l5-6 4 3 7-9" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="12" y="32" text-anchor="middle" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Market</text>
    </g>
    <!-- Cards Tab -->
    <g transform="translate(235, 12)">
      <rect x="2" y="4" width="20" height="14" rx="3" stroke="#64748B" stroke-width="2" fill="none"/>
      <line x1="2" y1="8" x2="22" y2="8" stroke="#64748B" stroke-width="2"/>
      <text x="12" y="32" text-anchor="middle" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Kartu</text>
    </g>
    <!-- Settings Tab -->
    <g transform="translate(325, 12)">
      <circle cx="12" cy="11" r="5" stroke="#64748B" stroke-width="2" fill="none"/>
      <text x="12" y="32" text-anchor="middle" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Akun</text>
    </g>
    <!-- Home Indicator -->
    <rect x="126" y="66" width="140" height="4" rx="2" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>

