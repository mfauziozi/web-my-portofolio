      <circle cx="34" cy="36" r="11" stroke="#EF4444" stroke-width="2" fill="none"/>
      
      <text x="58" y="34" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="700" font-size="16">TestFlight Build Release v2.4.0</text>
