    <text x="92" y="52" text-anchor="middle" fill="#000000" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">19</text>
    <circle cx="92" cy="62" r="2.5" fill="#000000"/>

    <rect x="130" y="0" width="55" height="74" rx="16" fill="#1A202C" stroke="#2D3748"/>
    <text x="157" y="25" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Rab</text>
    <text x="157" y="52" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">20</text>

    <rect x="195" y="0" width="55" height="74" rx="16" fill="#1A202C" stroke="#2D3748"/>
    <text x="222" y="25" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Kam</text>
    <text x="222" y="52" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">21</text>

