      <rect width="353" height="96" rx="20" fill="#18202F" stroke="#2B374E" stroke-width="1"/>
      <circle cx="34" cy="36" r="11" stroke="#64748B" stroke-width="2" fill="none"/>
      
      <text x="58" y="34" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">WWDC24 Session Recap</text>
      <text x="58" y="54" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Explore Swift 6 Complete Concurrency feature flag</text>
      
