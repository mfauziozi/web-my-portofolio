      <path d="M8 9h8M8 13h5" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/>
      <text x="12" y="32" text-anchor="middle" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Tugas</text>
