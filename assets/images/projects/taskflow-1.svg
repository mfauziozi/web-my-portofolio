      <rect width="353" height="96" rx="20" fill="#141924" stroke="#1E2738" stroke-width="0.8" opacity="0.8"/>
      
      <circle cx="34" cy="36" r="11" fill="#10B981"/>
      <path d="M29 36l3.5 3.5 7-7" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
      
      <text x="58" y="34" fill="#64748B" font-family="-apple-system, sans-serif" font-weight="600" font-size="15" text-decoration="line-through">Fix Memory Leak in AVPlayer</text>
      <text x="58" y="54" fill="#475569" font-family="-apple-system, sans-serif" font-size="12">Weak self closure capture on publisher pipeline</text>
      
